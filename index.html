<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <meta
      name="description"
      content="Explore nine questions about integration services, from API design to reliability."
    >
    <title>The Great API Hunt</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f7f8fc;
        color: #20243a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 10% 0%, rgb(220 227 255 / 55%), transparent 34rem),
          #f7f8fc;
      }

      button {
        font: inherit;
      }

      .page {
        width: min(100% - 48px, 1080px);
        margin: 0 auto;
        padding: 72px 0 64px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 16px;
        color: #606782;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7164ed;
        content: "";
      }

      h1 {
        margin: 0;
        font-size: clamp(2.35rem, 6vw, 4rem);
        font-weight: 750;
        letter-spacing: -0.065em;
        line-height: 1.05;
      }

      .intro {
        max-width: 570px;
        margin: 18px 0 0;
        color: #697087;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 44px;
      }

      .card {
        --accent: #6459de;
        --tint: #efedff;

        position: relative;
        display: flex;
        min-height: 174px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
        padding: 24px;
        border: 1px solid color-mix(in srgb, var(--accent) 15%, white);
        border-radius: 18px;
        background: linear-gradient(145deg, white 15%, var(--tint));
        box-shadow: 0 5px 16px rgb(34 39 74 / 4%);
        color: #252943;
        cursor: pointer;
        text-align: left;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .card::after {
        position: absolute;
        top: -34px;
        right: -30px;
        width: 112px;
        height: 112px;
        border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
        border-radius: 50%;
        box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent) 6%, transparent);
        content: "";
        pointer-events: none;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: color-mix(in srgb, var(--accent) 38%, white);
        box-shadow: 0 14px 28px rgb(34 39 74 / 10%);
      }

      .card:focus-visible,
      .close-button:focus-visible {
        outline: 3px solid var(--accent, #6459de);
        outline-offset: 4px;
      }

      .card-bottom {
        display: flex;
        width: 100%;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }

      .card-title {
        font-size: 1.1rem;
        font-weight: 680;
        letter-spacing: -0.025em;
      }

      .card-arrow {
        color: var(--accent);
        font-size: 1.25rem;
        line-height: 1;
        transition: transform 180ms ease;
      }

      .card:hover .card-arrow {
        transform: translateX(4px);
      }

      .card:nth-child(2) {
        --accent: #17836b;
        --tint: #e6f7f1;
      }

      .card:nth-child(3) {
        --accent: #cc7141;
        --tint: #fff0e7;
      }

      .card:nth-child(4) {
        --accent: #3277c5;
        --tint: #e9f2ff;
      }

      .card:nth-child(5) {
        --accent: #b64b82;
        --tint: #fcebf4;
      }

      .card:nth-child(6) {
        --accent: #aa7a12;
        --tint: #fff6db;
      }

      .card:nth-child(7) {
        --accent: #56853b;
        --tint: #eef7e7;
      }

      .card:nth-child(8) {
        --accent: #4971b8;
        --tint: #eaf0ff;
      }

      .card:nth-child(9) {
        --accent: #8756bd;
        --tint: #f3eaff;
      }

      .hint {
        margin: 22px 0 0;
        color: #858ba0;
        font-size: 0.875rem;
        text-align: center;
      }

      .modal-backdrop {
        position: fixed;
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgb(25 29 47 / 48%);
        inset: 0;
      }

      .modal-backdrop[hidden] {
        display: none;
      }

      .modal {
        width: min(100%, 500px);
        max-height: calc(100vh - 48px);
        max-height: calc(100dvh - 48px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 32px;
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 24px 80px rgb(20 24 48 / 24%);
        animation: modal-enter 160ms ease-out;
      }

      .modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      .modal-label {
        margin: 0 0 9px;
        color: var(--modal-accent, #6459de);
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .modal h2 {
        margin: 0;
        font-size: 1.65rem;
        letter-spacing: -0.045em;
      }

      .close-button {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #f2f3f8;
        color: #525970;
        cursor: pointer;
        font-size: 1.35rem;
      }

      .close-button:hover {
        background: #e9eaf1;
      }

      .modal-question {
        margin: 24px 0 0;
        color: #525970;
        font-size: 1.1rem;
        line-height: 1.75;
        white-space: pre-line;
      }

      @keyframes modal-enter {
        from {
          transform: translateY(8px) scale(0.98);
          opacity: 0;
        }

        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      @media (max-width: 760px) {
        .page {
          padding-top: 54px;
        }

        .card-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
      }

      @media (max-width: 480px) {
        .page {
          width: min(100% - 32px, 420px);
          padding: 42px 0;
        }

        .card-grid {
          grid-template-columns: 1fr;
          margin-top: 32px;
        }

        .card {
          min-height: 142px;
          padding: 20px;
        }

        .modal {
          padding: 26px 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">Integration Services</p>
        <h1>The Great API Hunt</h1>
        <p class="intro">
          Nine scenarios to explore. Choose a card to reveal its scenario.
        </p>
      </header>

      <section class="card-grid" aria-label="Integration service questions">
        <button class="card" type="button" data-title="P2 incident Recovery" data-question="You are an SRE on a live P2 incident bridge. Multiple customer journeys are failing because calls to the API endpoint:&#10;&#10;/payments/v1/standing-order/enquire&#10;&#10;are timing out.&#10;&#10;Application teams on the call know they consume the API, but nobody can identify:&#10;&#10;Which team owns it?&#10;Who the support contacts are?&#10;Which platform hosts it?&#10;Where the API documentation is located?&#10;&#10;Using the Integration Catalogue, find the API and identify the owning team so the incident manager can bring the correct responders onto the bridge and accelerate service recovery.">
          <span class="card-bottom"><span class="card-title">P2 incident Recovery</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Reduce Payment Failures with payee name validation" data-question="Payment Operations has identified that a significant number of customer payments are failing during settlement because the beneficiary name does not match the destination account details, resulting in lower Straight Through Processing (STP) rates and increased operational intervention.&#10;&#10;Which API in the Integration Catalogue can verify a payee's name before payment submission helping to increase STP and reduce payment failures?">
          <span class="card-bottom"><span class="card-title">Reduce Payment Failures with payee name validation</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Expanding International Payments for APAC Customers" data-question="The Bank's Mobile Banking Platform already uses the FX Rates API to power the international payment journey for customers sending money overseas.&#10;&#10;When a customer initiates an international transfer, the platform retrieves real-time FX rates and displays:&#10;&#10;Current exchange rate&#10;&#10;Estimated amount the beneficiary will receive&#10;&#10;Currency conversion information&#10;&#10;Indicative transfer value before confirmation&#10;&#10;This capability helps customers make informed decisions before submitting a foreign currency payment.&#10;&#10;As part of an APAC expansion initiative, the business wants to introduce support for Singapore Dollar (SGD) transfers.&#10;&#10;Using the Integration catalogue, how do you determine whether SGD exchange rates are provided by FX Rates API so as to display real-time FX rates for customers before they submit an international payment?">
          <span class="card-bottom"><span class="card-title">Expanding International Payments for APAC Customers</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Senior Citizens Saving Product" data-question="The Bank is introducing a new savings product that is only available to customers aged 60 and above.&#10;&#10;The digital onboarding team wants to automatically verify customer eligibility without asking customers to upload proof-of-age documents.&#10;&#10;&#10;Which reusable API can be integrated into the existing onboarding journey to verify whether a customer meets the minimum age requirement and streamline the account opening process?">
          <span class="card-bottom"><span class="card-title">Senior Citizens Saving Product</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Customers moving Home" data-question="The Bank is investing in improving its digital self-service capabilities to reduce customer calls to contact centres.&#10;&#10;One of the most common customer requests is updating a residential address after moving home. Currently, many customers contact the bank by phone or visit a branch to notify the bank of their new address, resulting in:&#10;&#10;Increased contact centre volumes&#10;Longer customer wait times&#10;Manual processing effort&#10;Delayed updates across banking products&#10;&#10;The Digital Banking team wants to enable customers to update their address seamlessly through the Mobile Banking App and Online Banking.&#10;&#10;Which API in the Integration Catalogue can be reused to support this end-to-end address change journey?">
          <span class="card-bottom"><span class="card-title">Customers moving Home</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Know Your Customer" data-question="A new digital account opening journey is being launched for both individual and business customers.&#10;&#10;Before an account can be approved, the bank must screen applicants against sanctions, politically exposed person (PEP), and financial crime watchlists to comply with regulatory requirements.&#10;&#10;Which reusable API in the Integration Catalogue would you integrate into the onboarding journey to perform customer screening and support AML, CDD, and sanctions compliance checks?">
          <span class="card-bottom"><span class="card-title">Know Your Customer</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="First-Time Home Buyer" data-question="A customer is planning to buy their first home and wants to understand:&#10;&#10;How much they could borrow&#10;&#10;Which mortgage products they may be eligible for&#10;&#10;Indicative mortgage rates&#10;&#10;Estimated monthly repayments&#10;&#10;The bank wants to offer customers instant, self-service answers through its website and mobile app, without impacting their credit score.&#10;&#10;Which reusable API would you integrate into the digital home-buying journey to provide borrowing estimates, mortgage rates, and repayment calculations">
          <span class="card-bottom"><span class="card-title">First-Time Home Buyer</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Financial Wellness" data-question="The Bank is launching a new Financial Wellness Hub within its Mobile Banking App to help customers better understand their spending habits and proactively manage their finances.&#10;&#10;The bank wants to move beyond simply displaying transactions and instead provide customers with personalised insights such as:&#10;&#10;- How much they're spending on utilities each month?&#10;- Which merchants they use most frequently?&#10;- How much of their spending is discretionary versus essential?&#10;- How much they're spending while travelling?&#10;- Opportunities to save money and improve financial wellbeing&#10;&#10;Which reusable API in the Integration Catalogue would you use to generate these personalised spending insights and power the Financial Wellness experience?">
          <span class="card-bottom"><span class="card-title">Financial Wellness</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
        <button class="card" type="button" data-title="Building smarter forms" data-question="A development team is büilding a new customer application form.&#10;&#10;The form requires several drop-down fields, including:&#10;&#10;Country&#10;&#10;Currency&#10;&#10;Company Type&#10;&#10;Industry Classification&#10;&#10;The team wants a solution that ensures the values are always up to date and consistent across all channels.&#10;&#10;Find the reusable API that provides reference data such as country codes, currency codes, SIC codes, role types, and other standard classifications.">
          <span class="card-bottom"><span class="card-title">Building smarter forms</span><span class="card-arrow" aria-hidden="true">→</span></span>
        </button>
      </section>

      <p class="hint">Pick any card to see its question.</p>
    </main>

    <div class="modal-backdrop" id="question-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-question">
        <div class="modal-header">
          <div>
            <p class="modal-label" id="modal-label">Question 01</p>
            <h2 id="modal-title"></h2>
          </div>
          <button class="close-button" id="close-modal" type="button" aria-label="Close question">×</button>
        </div>
        <p class="modal-question" id="modal-question"></p>
      </section>
    </div>

    <script>
      const backdrop = document.querySelector("#question-backdrop");
      const modalTitle = document.querySelector("#modal-title");
      const modalLabel = document.querySelector("#modal-label");
      const modalQuestion = document.querySelector("#modal-question");
      const closeButton = document.querySelector("#close-modal");
      const cards = document.querySelectorAll(".card");
      let previouslyFocusedCard;

      function closeModal() {
        backdrop.hidden = true;
        previouslyFocusedCard?.focus();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => {
          previouslyFocusedCard = card;
          modalLabel.textContent = `Question ${String(index + 1).padStart(2, "0")}`;
          modalTitle.textContent = card.dataset.title;
          modalQuestion.textContent = card.dataset.question;
          backdrop.hidden = false;
          closeButton.focus();
        });
      });

      closeButton.addEventListener("click", closeModal);
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !backdrop.hidden) closeModal();
      });
    </script>
  </body>
</html>
